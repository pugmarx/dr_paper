name: Daily Paper Ingestion & AI Curation

on:
  schedule:
    # Runs every day at 08:00 UTC (01:00 AM PT / 04:00 AM ET)
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of candidate papers to ingest (default: 2)'
        required: false
        default: '2'
        type: string
      auto_publish:
        description: 'Publish directly (status=published) instead of draft staging'
        required: false
        default: false
        type: boolean
      test_telegram:
        description: 'Send a test card to Telegram to verify bot connection'
        required: false
        default: false
        type: boolean
      notify_staged_drafts:
        description: 'Send Telegram cards for all existing drafts in Supabase'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: "daily-curation"
  cancel-in-progress: false

jobs:
  ingest:
    name: Ingest and Curate Research Papers
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Dr. Paper Ingestion Pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: |
          if [ "${{ inputs.test_telegram }}" = "true" ]; then
            echo "[*] Sending test card to Telegram..."
            python src/pipeline.py --test-telegram
            exit 0
          fi

          if [ "${{ inputs.notify_staged_drafts }}" = "true" ]; then
            echo "[*] Sending Telegram cards for staged drafts..."
            python src/pipeline.py --notify-drafts
            exit 0
          fi

          LIMIT="${{ inputs.limit }}"
          if [ -z "$LIMIT" ]; then
            LIMIT="2"
          fi
          
          CMD="python src/pipeline.py --ingest --limit $LIMIT"
          if [ "${{ inputs.auto_publish }}" = "true" ]; then
            CMD="$CMD --auto-publish"
          fi
          
          echo "Executing: $CMD"
          $CMD

      - name: Workflow Run Summary
        if: always()
        run: |
          echo "### 🔬 Dr. Paper Daily Ingestion Run" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY

