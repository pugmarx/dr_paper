<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" style="background-color: #ffffff; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;">
  <style>
    .box { fill: #ffffff; stroke: #1e293b; stroke-width: 1.5; rx: 4px; }
    .box-sub { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; rx: 3px; }
    .title { font-size: 17px; font-weight: 700; fill: #0f172a; }
    .header { font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 0.5px; }
    .subtext { font-size: 11px; fill: #64748b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .label { font-size: 11.5px; font-weight: 600; fill: #1e293b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .code { font-size: 11px; fill: #0f172a; }
    .arrow { stroke: #475569; stroke-width: 1.5; fill: none; }
  </style>

  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569" />
    </marker>
  </defs>

  <!-- Canvas Header -->
  <text x="40" y="42" class="title">System Architecture: Dr. Paper</text>
  <!-- 1. INGESTION -->
  <rect x="40" y="90" width="245" height="460" class="box" />
  <text x="60" y="120" class="header">1. INGESTION</text>
  <text x="60" y="138" class="subtext">Weekly automated fetch</text>

  <!-- Trigger -->
  <rect x="60" y="155" width="205" height="50" class="box-sub" />
  <text x="72" y="176" class="label">Scheduled Trigger</text>
  <text x="72" y="193" class="code">GitHub Actions (Weekly cron)</text>

  <!-- Sources -->
  <rect x="60" y="218" width="205" height="120" class="box-sub" />
  <text x="72" y="239" class="label">Candidate Sources</text>
  <text x="72" y="260" class="code">• arXiv (cs.CL, cs.AI, cs.LG)</text>
  <text x="72" y="280" class="code">• Hugging Face Daily Papers</text>
  <text x="72" y="300" class="code">• AI Newsletters (RSS)</text>
  <text x="72" y="320" class="code">• Semantic Scholar API</text>

  <!-- Filter & Rank -->
  <rect x="60" y="351" width="205" height="175" class="box-sub" />
  <text x="72" y="372" class="label">Filtering &amp; Ranking</text>
  <text x="72" y="394" class="code">• Deduplicate cross-posts</text>
  <text x="72" y="414" class="code">• Score by community upvotes</text>
  <text x="72" y="434" class="code">• Filter non-CS domains</text>
  <text x="72" y="460" class="label">Output:</text>
  <text x="72" y="480" class="code">Top 5-10 candidate papers</text>
  <text x="72" y="498" class="code">(Title, Abstract, PDF URL)</text>

  <!-- Arrow 1 -> 2 -->
  <path d="M 285 320 L 333 320" class="arrow" marker-end="url(#arrowhead)" />

  <!-- 2. 2-STAGE AI PROCESSING -->
  <rect x="335" y="90" width="265" height="460" class="box" />
  <text x="355" y="120" class="header">2. 2-STAGE AI ENGINE</text>
  <text x="355" y="138" class="subtext">Fact extraction &amp; narrative writing</text>

  <!-- Stage 1 Extractor -->
  <rect x="355" y="155" width="225" height="140" class="box-sub" />
  <text x="367" y="176" class="label">Stage 1: Fact Extractor</text>
  <text x="367" y="194" class="subtext">Gemini 2.5 Flash</text>
  <text x="367" y="216" class="code">• Extract core architecture</text>
  <text x="367" y="236" class="code">• Extract baseline comparisons</text>
  <text x="367" y="256" class="code">• Extract concrete numbers &amp; %</text>
  <text x="367" y="276" class="code">• Output: Structured Fact JSON</text>

  <!-- Internal Arrow -->
  <path d="M 467 295 L 467 318" class="arrow" marker-end="url(#arrowhead)" />

  <!-- Stage 2 Writer -->
  <rect x="355" y="320" width="225" height="145" class="box-sub" />
  <text x="367" y="341" class="label">Stage 2: Technical Writer</text>
  <text x="367" y="359" class="subtext">Groq LLM / Open Weights</text>
  <text x="367" y="381" class="code">• Writes 450-word overview</text>
  <text x="367" y="401" class="code">• Context-specific headings</text>
  <text x="367" y="421" class="code">• Ban on generic AI cliches</text>
  <text x="367" y="441" class="code">• Output: The Gist + Deep Dive</text>

  <!-- Save Draft -->
  <rect x="355" y="477" width="225" height="49" class="box-sub" />
  <text x="367" y="497" class="label">Save Draft</text>
  <text x="367" y="513" class="code">Writes to DB with status='draft'</text>

  <!-- Arrow 2 -> 3 -->
  <path d="M 600 320 L 648 320" class="arrow" marker-end="url(#arrowhead)" />

  <!-- 3. REVIEW & PUBLISH -->
  <rect x="650" y="90" width="245" height="460" class="box" />
  <text x="670" y="120" class="header">3. REVIEW &amp; PUBLISH</text>
  <text x="670" y="138" class="subtext">1-Tap mobile approval</text>

  <!-- Telegram Card -->
  <rect x="670" y="155" width="205" height="150" class="box-sub" />
  <text x="682" y="176" class="label">Telegram Review Card</text>
  <text x="682" y="196" class="code">• Paper title &amp; categories</text>
  <text x="682" y="216" class="code">• "The Gist" summary</text>
  <text x="682" y="236" class="code">• Key takeaways list</text>
  <text x="682" y="262" class="label">Action Buttons:</text>
  <text x="682" y="282" class="code">[Publish] [Reject]</text>

  <!-- Internal Arrow -->
  <path d="M 772 305 L 772 328" class="arrow" marker-end="url(#arrowhead)" />

  <!-- 1-Tap Execution -->
  <rect x="670" y="330" width="205" height="196" class="box-sub" />
  <text x="682" y="351" class="label">1-Tap Moderation URL</text>
  <text x="682" y="369" class="subtext">Serverless Cloud Function</text>
  <text x="682" y="393" class="code">• User taps [Publish] on phone</text>
  <text x="682" y="413" class="code">• Cloud function updates DB:</text>
  <text x="692" y="433" class="code">status: 'draft' &#8594; 'published'</text>
  <text x="682" y="455" class="code">• Sets published timestamp</text>
  <text x="682" y="475" class="code">• Instant mobile confirmation</text>
  <text x="682" y="503" class="subtext">Zero login screens or forms</text>

  <!-- Arrow 3 -> 4 -->
  <path d="M 895 320 L 943 320" class="arrow" marker-end="url(#arrowhead)" />

  <!-- 4. WEB READER -->
  <rect x="945" y="90" width="215" height="460" class="box" />
  <text x="965" y="120" class="header">4. WEB READER</text>
  <text x="965" y="138" class="subtext">Live feed &amp; reading state</text>

  <!-- Database -->
  <rect x="965" y="155" width="175" height="130" class="box-sub" />
  <text x="977" y="176" class="label">PostgreSQL (Supabase)</text>
  <text x="977" y="196" class="code">• papers table</text>
  <text x="977" y="216" class="code">• user_interactions</text>
  <text x="977" y="242" class="label">Read Rule:</text>
  <text x="977" y="260" class="code">Only serves 'published'</text>

  <!-- Internal Arrow -->
  <path d="M 1052 285 L 1052 308" class="arrow" marker-end="url(#arrowhead)" />

  <!-- Frontend UI -->
  <rect x="965" y="310" width="175" height="216" class="box-sub" />
  <text x="977" y="331" class="label">Web Client (Static)</text>
  <text x="977" y="349" class="subtext">Hosted on Hugging Face</text>
  <text x="977" y="373" class="code">• Unread Queue feed</text>
  <text x="977" y="393" class="code">• [Mark Read] / [Save]</text>
  <text x="977" y="413" class="code">• Mobile swipe to dismiss</text>
  <text x="977" y="433" class="code">• Search &amp; topic filter</text>
  <text x="977" y="453" class="code">• Offline-first caching</text>
  <text x="977" y="473" class="code">• Cross-device sync</text>
  <text x="977" y="501" class="subtext">Direct API connection</text>
</svg>
